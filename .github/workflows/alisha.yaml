name: myworkflow1
on:
  push:
  workflow_dispatch:
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
      - name: mystep1
        run: |
          whoami
          pwd
          cat /etc/os-release
          cd
          ls -al
          docker --version
          docker compose version
          sshpass -V
      - name: mystep2-clone the repo in current directory
        uses: actions/checkout@v4
      - name: mystep3-check the source code
        run: ls -al
      - name: mystep4-docker image build
        run: docker image build -t alishakhannnnnnnnn03/myimage_nov1:t${{ github.run_number }} -f Dockerfile .
      - name: mystep5-check the docker images
        run: docker images
      - name: mystep6-login to dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: mystep7-push the docker image
        run: docker image push alishakhannnnnnnnn03/myimage_nov1:t${{ github.run_number }}
      - name: mystep8
        run: sshpass -p 'Anil@332211' ssh \
             -o StrictHostKeyChecking=accept-new \
             root@168.68.105.85 \
             'ls -al'

